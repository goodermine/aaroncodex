[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxpolish"
version = "0.1.0"
description = "AI vocal cleanup: drop in a song or talk recording, get back a repaired vocal"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
]

[project.optional-dependencies]
# Everything below is optional: the pipeline runs with DSP fallbacks without them,
# and upgrades itself when they are installed (Apple Silicon: torch uses MPS).
# Separation uses the MIT Mel-Band RoFormer via audio-separator (MIT), which
# pulls its own torch/onnxruntime. Demucs is intentionally NOT used: its
# pretrained weights are CC-BY-NC (non-commercial). See the audit §2.
separation = ["audio-separator>=0.18"]
clean = ["deepfilternet>=0.5"]
vad = ["torch>=2.1", "silero-vad>=5.0"]
ui = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
# pyworld (the WORLD vocoder that Auto Tune renders through) does
# `import pkg_resources` at import time, and pkg_resources ships INSIDE
# setuptools — which Python 3.12+ no longer installs by default. Without it the
# vocoder import raises and Auto Tune is silently bypassed on the host (it worked
# in dev only because setuptools happened to be present). Declaring setuptools
# here makes `pip install voxpolish[pitch]` restore pkg_resources every time,
# instead of needing a manual `pip install --upgrade setuptools` on each host.
pitch = ["pyworld>=0.3", "setuptools>=68"]
dev = ["pytest>=7.0", "httpx2>=0.1", "httpx>=0.27"]

[project.scripts]
voxpolish = "voxpolish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
