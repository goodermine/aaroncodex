# VOX Suite — local run and the base for a cloud deploy.
#
#   docker compose up --build          # build + run on http://localhost:8080
#
# The same file runs on a cloud host; the extra cloud steps (TLS, auth) are the
# commented blocks below and are documented in docs/DEPLOYMENT.md.

services:
  vox:
    build:
      context: .
      args:
        # Flip these to 0 for a lean image (light apps + scoring, DSP-fallback
        # separation). Defaults build the full heavy image with RoFormer + auto-tune.
        WITH_SEPARATION: "1"
        WITH_PITCH: "1"
        PREFETCH_MODEL: "1"
        # Stamp the running commit into the image (no .git inside) so /api/build
        # shows it. Build with:  VOX_BUILD_COMMIT=$(git rev-parse --short=12 HEAD) docker compose up --build
        VOX_BUILD_COMMIT: "${VOX_BUILD_COMMIT:-}"
        VOX_BUILD_BRANCH: "${VOX_BUILD_BRANCH:-}"
    image: voxsuite:latest
    ports:
      - "8080:8080"
    volumes:
      # Job state, uploads and new analyses persist here across restarts/rebuilds.
      - vox-data:/data
    environment:
      VOX_BASE: /data
      # Uncomment to hard-pin A4 etc. via the app's own settings; none required to run.
    restart: unless-stopped
    # HEALTHCHECK is defined in the image (hits /api/systems).

    # --- GPU (optional) ------------------------------------------------------
    # RoFormer separation is much faster on a GPU. On an NVIDIA host with the
    # container toolkit, build from a CUDA base (see docs/DEPLOYMENT.md) and add:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # --- Singnexa beta: the public, login-gated app for invited test users -----
  # Same Dockerfile, but its own image tag (singnexa:beta), command, port and
  # data. The separate tag matters: if both services shared voxsuite:latest,
  # building singnexa would retag it and the next bare `docker compose up -d`
  # would quietly recreate `vox` on that build. Analyze only (no Polish/Fused),
  # no YouTube lookup, uploads deleted after analysis, results kept.
  # Bound to 127.0.0.1 on purpose: reach it only through an HTTPS tunnel or
  # proxy on this host (Tailscale Funnel, Cloudflare Tunnel, Caddy) — see
  # docs/handoffs/SINGNEXA_BETA_DEPLOY.md.
  #
  #   docker compose up -d --build singnexa
  #   docker compose exec singnexa singnexa-admin create-user aaron --name "Aaron" --admin
  singnexa:
    image: singnexa:beta
    build:
      context: .
      args:
        WITH_SEPARATION: "1"
        WITH_PITCH: "1"
        PREFETCH_MODEL: "1"
        VOX_BUILD_COMMIT: "${VOX_BUILD_COMMIT:-}"
        VOX_BUILD_BRANCH: "${VOX_BUILD_BRANCH:-}"
    command: ["singnexa", "--host", "0.0.0.0", "--port", "8090", "--data", "/data/singnexa"]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - singnexa-data:/data
    environment:
      SINGNEXA_DATA: /data/singnexa
      SINGNEXA_COOKIE_SECURE: "1"          # it is served over HTTPS by the tunnel
      SINGNEXA_TRUSTED_PROXIES: "*"        # only the local tunnel can reach the port
      SINGNEXA_MAX_UPLOAD_MB: "300"
      SINGNEXA_DAILY_LIMIT: "10"
      # Coaching write-up (Claude API). Put the key in an untracked .env next to
      # this file, never here; unset means the write-up is simply switched off.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SINGNEXA_WRITEUP_MODEL: "${SINGNEXA_WRITEUP_MODEL:-claude-opus-5-5}"
      SINGNEXA_CUT_TALK: "1"               # cut MC/chat/thank-yous before scoring
      # CPU-only separation is slow: give long songs room before a timeout.
      VOX_PITCH_TIMEOUT: "5400"
      VOX_STEM_TIMEOUT: "4500"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # --- TLS + auth for a public cloud instance (optional) ---------------------
  # The mic (monitor/TimberTones) needs HTTPS, and the engine + private singer
  # data must sit behind a login. Front `vox` with a reverse proxy that
  # terminates TLS and adds auth — e.g. Caddy (auto-HTTPS) or Traefik. Example:
  #
  # proxy:
  #   image: caddy:2
  #   depends_on: [vox]
  #   ports: ["443:443", "80:80"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile   # reverse_proxy vox:8080 + basicauth
  #     - caddy-data:/data
  #   restart: unless-stopped

volumes:
  vox-data:
  singnexa-data:
  # caddy-data:
